name: Verify the Scales 1.3 upgrade
on:
  push:
    branches: ['release-assets/v1.3']
    paths:
      - '.github/workflows/check-upgrade-1.3.yml'
      - 'checks/**'
      - 'downloads/Scales-1.3.apk'
permissions:
  contents: read
jobs:
  upgrade:
    name: Install v1.2, save measurements, upgrade to v1.3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify both signed APK files
        working-directory: downloads
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -sS https://github.com/smartdevuk/Scales/releases/download/v1.2/Scales-1.2.apk -o Scales-1.2.apk
          echo 'de44661aae163a32cf805203ff6b82dae5c6b683b27c3ebb96887a1d3d3fd704  Scales-1.2.apk' | sha256sum --check
          sha256sum --check Scales-1.3.apk.sha256
      - name: Enable virtualisation on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the in-place update on Android 14
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 480
          disable-animations: true
          script: cd downloads && bash ../checks/upgrade.sh
